name: Windows build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: |
          python -m playwright install chromium
          python -m pytest -q

      - name: Build (folder)
        run: python build.py

      - name: Build (single exe)
        run: python build.py --onefile --no-fetch

      - name: Check bundled ffmpeg and Deno
        shell: pwsh
        run: |
          foreach ($exe in "dist\Media Minds Downloader\Media Minds Downloader.exe", "dist\Media Minds Downloader.exe") {
            $p = Start-Process $exe -ArgumentList "--check", "$PWD\check.txt" -Wait -PassThru
            Get-Content check.txt
            if ($p.ExitCode -ne 0) { throw "$exe --check failed" }
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist\Media Minds Downloader" -DestinationPath MediaMindsDownloader-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MediaMindsDownloader-windows
          path: |
            MediaMindsDownloader-windows.zip
            dist/Media Minds Downloader.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MediaMindsDownloader-windows.zip
            dist/Media Minds Downloader.exe
