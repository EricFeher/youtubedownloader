<style>
#language-designs{font-family:'Segoe UI',sans-serif;display:grid;gap:20px;color:var(--foreground)}
#language-designs *{box-sizing:border-box}
#language-designs .variant-name{font-size:13px;margin:0 0 9px;font-weight:500;color:var(--muted-foreground)}
#language-designs .app{background:#242424;color:#fff;border:1px solid #393939;border-radius:18px;padding:22px 24px;min-height:152px;font-size:14px}
#language-designs .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#language-designs .brand{display:flex;align-items:center;gap:12px}
#language-designs .logo{width:34px;height:34px;object-fit:contain}
#language-designs .wordmark{font-size:18px;font-weight:600;letter-spacing:-.5px}
#language-designs .wordmark span{color:#75ea75}
#language-designs button{font:inherit;color:inherit;cursor:pointer}
#language-designs .picker{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #454545;background:#2b2b2b;border-radius:10px;transition:background .15s}
#language-designs .picker:hover{background:#353535;border-color:#6d6d6d}
#language-designs .arrow{font-size:12px;color:#b0b0b0;margin-left:5px}
#language-designs .globe{font-size:20px;line-height:1;color:#c8c8c8}
#language-designs .url{display:flex;align-items:center;gap:10px;background:#1b1b1b;border:1px solid #393939;border-radius:30px;padding:13px 16px;color:#9b9b9b;margin-top:24px;font-size:13px}
#language-designs .link{color:#75ea75;font-size:18px}
#language-designs .hu{display:inline-block;flex:none;width:21px;height:14px;border-radius:3px;background:linear-gradient(#ce2939 0 33.33%,#fff 33.33% 66.66%,#477050 66.66%);box-shadow:0 0 0 1px #ffffff1a}
#language-designs .en{display:inline-block;flex:none;width:21px;height:14px;border-radius:3px;background:linear-gradient(90deg,transparent 42%,#c8102e 42% 58%,transparent 58%),linear-gradient(transparent 36%,#c8102e 36% 64%,transparent 64%),linear-gradient(90deg,transparent 34%,#fff 34% 66%,transparent 66%),linear-gradient(transparent 25%,#fff 25% 75%,transparent 75%),linear-gradient(34deg,transparent 43%,#fff 43% 48%,#c8102e 48% 52%,#fff 52% 57%,transparent 57%),linear-gradient(-34deg,#012169 43%,#fff 43% 48%,#c8102e 48% 52%,#fff 52% 57%,#012169 57%)}
#language-designs .dropdown{position:relative}
#language-designs .menu{position:absolute;right:0;top:calc(100% + 7px);min-width:164px;background:#303030;border:1px solid #4b4b4b;border-radius:12px;padding:5px;z-index:2;box-shadow:0 10px 25px #0005}
#language-designs [hidden]{display:none!important}
#language-designs .option{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:7px}
#language-designs .option:hover{background:#414141}
#language-designs .option.selected{color:#75ea75;background:#75ea7510}
#language-designs .check{margin-left:auto;color:#75ea75}
#language-designs .segments{display:flex;border:1px solid #454545;border-radius:11px;padding:3px;background:#1e1e1e;gap:3px}
#language-designs .segment{display:flex;align-items:center;gap:7px;border:0;border-radius:7px;background:transparent;padding:8px 10px;color:#aaa}
#language-designs .segment[aria-pressed=true]{background:#354535;color:#a0f0a0;box-shadow:inset 0 0 0 1px #75ea7530}
#language-designs button:focus-visible{outline:2px solid #75ea75;outline-offset:3px}
@media(max-width:480px){#language-designs .app{padding:18px 16px}#language-designs .wordmark{font-size:16px}#language-designs .top{gap:18px}#language-designs .brand{width:100%}#language-designs .dropdown,#language-designs .segments{margin-left:auto}#language-designs .url{margin-top:18px}}
</style>
<div id="language-designs">
 <section aria-label="Földgömb és nyelvnév">
  <p class="variant-name">A · Földgömb + nyelvnév</p>
  <div class="app"><div class="top"><div class="brand"><img class="logo" src="D:/Projects/youtubedownloader-multilingual/ytletolto/web/mm-mark.png" alt=""><div class="wordmark">Media Minds <span>Downloader</span></div></div>
   <div class="dropdown" data-style="globe"><button class="picker" aria-label="Nyelvválasztás" aria-expanded="false"><span class="globe" aria-hidden="true">🌐</span><span class="current">Magyar</span><span class="arrow">⌄</span></button><div class="menu" hidden><button class="option selected" data-lang="hu">Magyar<span class="check">✓</span></button><button class="option" data-lang="en">English<span class="check" hidden>✓</span></button></div></div>
  </div><div class="url"><span class="link">↗</span><span class="placeholder">Illeszd be a YouTube linket…</span></div></div>
 </section>
 <section aria-label="Zászló és nyelvkód">
  <p class="variant-name">B · Zászló + rövid nyelvkód</p>
  <div class="app"><div class="top"><div class="brand"><img class="logo" src="D:/Projects/youtubedownloader-multilingual/ytletolto/web/mm-mark.png" alt=""><div class="wordmark">Media Minds <span>Downloader</span></div></div>
   <div class="dropdown" data-style="flag"><button class="picker" aria-label="Nyelvválasztás" aria-expanded="false"><span class="flag hu" aria-hidden="true"></span><span class="current">HU</span><span class="arrow">⌄</span></button><div class="menu" hidden><button class="option selected" data-lang="hu"><span class="hu" aria-hidden="true"></span>Magyar<span class="check">✓</span></button><button class="option" data-lang="en"><span class="en" aria-hidden="true"></span>English<span class="check" hidden>✓</span></button></div></div>
  </div><div class="url"><span class="link">↗</span><span class="placeholder">Illeszd be a YouTube linket…</span></div></div>
 </section>
 <section aria-label="Közvetlen nyelvváltó">
  <p class="variant-name">C · Közvetlen váltó</p>
  <div class="app"><div class="top"><div class="brand"><img class="logo" src="D:/Projects/youtubedownloader-multilingual/ytletolto/web/mm-mark.png" alt=""><div class="wordmark">Media Minds <span>Downloader</span></div></div>
   <div class="segments" role="group" aria-label="Nyelv"><button class="segment" data-lang="hu" aria-pressed="true"><span class="hu" aria-hidden="true"></span>HU</button><button class="segment" data-lang="en" aria-pressed="false"><span class="en" aria-hidden="true"></span>EN</button></div>
  </div><div class="url"><span class="link">↗</span><span class="placeholder">Illeszd be a YouTube linket…</span></div></div>
 </section>
</div>
<script>
(() => {
 const root=document.getElementById('language-designs');
 root.querySelectorAll('.dropdown').forEach(drop=>{
  const trigger=drop.querySelector('.picker'), menu=drop.querySelector('.menu');
  trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));});
  drop.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});
  drop.querySelectorAll('[data-lang]').forEach(option=>option.addEventListener('click',()=>{
   const lang=option.dataset.lang;
   drop.querySelector('.current').textContent=drop.dataset.style==='flag'?lang.toUpperCase():(lang==='hu'?'Magyar':'English');
   const flag=drop.querySelector('.flag');if(flag)flag.className='flag '+lang;
   drop.querySelectorAll('.option').forEach(item=>{item.classList.toggle('selected',item===option);item.querySelector('.check').hidden=item!==option;});
   drop.closest('.app').querySelector('.placeholder').textContent=lang==='hu'?'Illeszd be a YouTube linket…':'Paste a YouTube link…';
   menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();
  }));
 });
 root.querySelectorAll('.segment').forEach(button=>button.addEventListener('click',()=>{
  button.parentElement.querySelectorAll('.segment').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  button.closest('.app').querySelector('.placeholder').textContent=button.dataset.lang==='hu'?'Illeszd be a YouTube linket…':'Paste a YouTube link…';
 }));
})();
</script>
